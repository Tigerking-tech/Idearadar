name: Ingest community complaints

# 在 GitHub 托管 runner 上定时抓取，不依赖本机网络。
# 沙箱/本地受限时，把本文件连同 scripts/ 推送到仓库即可自动运行。
on:
  schedule:
    - cron: "17 */6 * * *" # 每 6 小时一次（UTC）
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for a manual run"
        required: false
        default: "manual"

permissions:
  contents: write
  # 翻译走 OpenAI 兼容端点，密钥从 Actions Secret 注入。
  # GitHub Models 已于 2026-07-30 退役，不再需要 models: read 权限。

concurrency:
  group: ingest-opportunities
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit-test the full pipeline
        run: node --test scripts/*.test.mjs

      # B2 门禁：用同一份 connector 跑「相关度 vs 时间」两种召回并写出 verdict。
      # 若相关度口径不达标，verdict=fallback，采集脚本会自动保留旧的时间排序，
      # 同时本步骤输出 ::warning:: 与 step summary，避免静默退化。
      - name: Evaluate recall quality (gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_DELAY_MS: "500"
        run: node scripts/eval-recall.mjs

      # 门禁跑 2 轮、采集跑 1 轮，共用同一个 GITHUB_TOKEN 的 Search 限额（30/min）。
      # connectors.mjs 内部已有 2.3s/请求节流，但两个进程的节流状态不共享，
      # 因此在两步之间冷却一个完整的限额窗口，避免跨进程叠加触发 403。
      - name: Cool down rate-limit window
        run: sleep 65

      - name: Run multi-source ingestion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：把采集结果推送到外部系统
          INGEST_WEBHOOK_URL: ${{ secrets.INGEST_WEBHOOK_URL }}
          # Reddit 默认关闭。只有持有 Reddit 商业数据授权时才在
          # 仓库 Secrets 中设置以下三项，并把 ENABLE_REDDIT 设为 true。
          ENABLE_REDDIT: ${{ vars.ENABLE_REDDIT || 'false' }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
        run: node scripts/ingest.mjs

      # 采集后把英文 title / quote 批量翻成中文写回产物。
      # 只走 OpenAI Chat Completions 兼容协议，换厂商只需改下面 3 个变量。
      # 默认用翻译专用模型 hy-mt2-plus（快、省 token），因此不下发 reasoning_effort：
      # 部分兼容端点不认识该字段会直接 400。若 BYOK 切回 hy3/hy4 等推理模型，
      # 再补 IDEARADAR_TRANSLATE_REASONING_EFFORT: low。
      # 脚本默认带 response_format=json_object 强制合法 JSON（翻译模型否则会吐
      # 畸形数组）；端点不支持时自动降级，无需在此配置。
      # 增量翻译（按原文哈希缓存），失败/限流/端点不可用时只 warn 并保留英文，
      # 绝不让翻译阻塞采集与数据提交。产物仍是原本那 6 个文件。
      - name: Translate content to Chinese
        env:
          IDEARADAR_TRANSLATE_TOKEN: ${{ secrets.IDEARADAR_TRANSLATE_TOKEN }}
          IDEARADAR_TRANSLATE_ENDPOINT: https://tokenhub.tencentmaas.com/v1/chat/completions
          IDEARADAR_TRANSLATE_MODEL: hy-mt2-plus
        run: node scripts/translate.mjs

      # 相关度方案 C：LLM 二次去噪。放在翻译之后，模型能同时看到中英文原文。
      # 复用同一个 TokenHub 密钥与协议，按 denoiseKey 增量缓存（每轮只判新增条目）。
      # 只有模型显式判 keep:false 才剔除；无 token / 请求失败 / 非法 JSON /
      # 驳回比例超阈值一律整批保留（fail-open，宁可放过不误杀），绝不让
      # Actions 变红或清空采集产物。被剔除条目写入 data/rejected.json 供人工复核。
      # 云端默认开启；把仓库变量 IDEARADAR_DENOISE 设为 0 可随时关闭以省 API 费用。
      - name: LLM relevance denoise
        env:
          IDEARADAR_DENOISE: ${{ vars.IDEARADAR_DENOISE || '1' }}
          IDEARADAR_TRANSLATE_TOKEN: ${{ secrets.IDEARADAR_TRANSLATE_TOKEN }}
          IDEARADAR_TRANSLATE_ENDPOINT: https://tokenhub.tencentmaas.com/v1/chat/completions
          IDEARADAR_TRANSLATE_MODEL: hy-mt2-plus
        run: node scripts/denoise.mjs

      # L1「一句话机会」：把去噪后的干净证据翻译成「给谁 + 做什么」的机会陈述，
      # 放在翻译/去噪之后，模型能同时看到中英文、且不必为噪声条目花钱。
      # 复用同一 TokenHub 密钥与 json_object 协议，按 ideaKey 增量缓存（每轮只
      # 生成新增条目）。无 token / 未启用 / 请求失败 / 非法 JSON 一律回退确定性
      # 模板（fail-open，绝不编造市场数字、绝不让 Actions 变红）。
      # 云端默认开启；把仓库变量 IDEARADAR_IDEA 设为 0 可随时关闭以省 API 费用
      # （关闭时仍为全部条目写确定性模板，前端永远有可读的一句话机会）。
      - name: Generate one-line opportunities
        env:
          IDEARADAR_IDEA: ${{ vars.IDEARADAR_IDEA || '1' }}
          IDEARADAR_TRANSLATE_TOKEN: ${{ secrets.IDEARADAR_TRANSLATE_TOKEN }}
          IDEARADAR_TRANSLATE_ENDPOINT: https://tokenhub.tencentmaas.com/v1/chat/completions
          IDEARADAR_TRANSLATE_MODEL: hy-mt2-plus
        run: node scripts/idea.mjs

      # P1 外部搜索热度：Google Trends 每日热榜（公开 RSS），与站内多快照趋势
      # 分口径展示。抓取失败/端点改版会诚实写 status=unavailable，绝不阻塞采集。
      - name: Fetch external search interest
        run: node scripts/external-heat.mjs

      # 第 3 步「沉淀」：把用户按需扫描过的高频方向提升为定时采集赛道，
      # 下一轮采集就会覆盖这些方向，固定索引自然变宽。脚本幂等，无新增时不改文件。
      # P0-1 召回准入闸门：方向必须有 /api/scan 落盘的高分候选证据，或用
      # createCollector 轻量入口（只跑 HN+StackExchange，避开 GitHub 限流）现场
      # 试跑达标，才允许提升；零召回方向 fail-closed 不提升，杜绝空转赛道。
      # 同时回收本轮零产出的 auto 赛道。IDEARADAR_PROMOTE_PROBE=0 可关闭 probe
      # （只认落盘证据）；正式部署配 IDEARADAR_STORE_URL 走远端存储闭环。
      - name: Promote frequent live-scan directions
        env:
          IDEARADAR_PROMOTE_PROBE: ${{ vars.IDEARADAR_PROMOTE_PROBE || '1' }}
          IDEARADAR_STORE_URL: ${{ secrets.IDEARADAR_STORE_URL }}
          IDEARADAR_STORE_TOKEN: ${{ secrets.IDEARADAR_STORE_TOKEN }}
        run: node scripts/promote-niches.mjs

      - name: Upload structured output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunities
          path: |
            data/opportunities.json
            public/opportunities.json
            data/history.json
            public/history.json
            data/recall-eval.json
            public/recall-eval.json
            data/rejected.json
            data/denoise.json
            data/idea.json
            data/external-heat.json
            public/external-heat.json
          retention-days: 14

      - name: Commit refreshed data
        run: |
          git config user.name "rantradar-bot"
          git config user.email "bot@rantradar.app"
          git add data/opportunities.json public/opportunities.json data/history.json public/history.json data/recall-eval.json public/recall-eval.json scripts/ingest.config.json
          # 新增产物都是「有则提交」：脚本首次运行或诚实降级时文件仍会生成，
          # 但用 -f 兜底，任何单文件缺失都不影响整批提交。
          for f in data/query-scans.json data/scan-candidates.json data/rejected.json data/denoise.json data/idea.json data/external-heat.json public/external-heat.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh opportunity index [skip ci]"
            # 代码推送可能与定时采集并发（remote contains work you do not have locally）。
            # 首次被拒时重放到最新 main 再推一次；冲突以本轮刚采集的数据为准。
            if ! git push origin HEAD:main; then
              echo "Push rejected (concurrent update). Rebasing onto latest main and retrying."
              git fetch origin main
              git rebase -X theirs origin/main
              git push origin HEAD:main
            fi
          fi
